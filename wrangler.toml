name = "PLACEHOLDER"
main = "src/worker.js"
compatibility_date = "2025-11-01"

# Custom domain is attached via CF API by the scaffolder (scripts/new-project.sh)
# rather than wrangler's `routes` block, because wrangler sometimes hits
# /zones/{zone}/workers/routes which needs an extra token scope.

[assets]
directory = "public"

# Uncomment after `wrangler d1 create <name>`:
# [[d1_databases]]
# binding = "DB"
# database_name = "PLACEHOLDER"
# database_id = "PLACEHOLDER"
